<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой трекер спортзала</title>
    
    <!-- Иконка для вкладки -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️‍♂️</text></svg>">
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️‍♂️</text></svg>">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🗓️ Мой календарь спортзала</h1>
        <div class="calendar-header">
            <button id="prev-month">←</button>
            <h2 id="current-month-year">Май 2024</h2>
            <button id="next-month">→</button>
        </div>
        <div id="calendar">
            <!-- Дни недели и числа будут генерироваться через JavaScript -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
